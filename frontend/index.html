<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image to Video</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Image to Video</h1>
      <p>Minimal frontend rebuilt from scratch.</p>
    </header>

    <section class="panel">
      <h2>Backend</h2>
      <div class="row">
        <label for="api-base">API URL</label>
        <input id="api-base" type="url" value="http://127.0.0.1:8000">
        <button id="save-base" type="button">Save</button>
      </div>
      <p id="backend-result" class="result">Set the backend base URL if needed.</p>
    </section>

    <section class="panel">
      <h2>Generate</h2>
      <form id="generate-form" class="form">
        <label>Prompt
          <textarea name="prompt" rows="4" required>A dramatic camera glide across a rain-soaked city rooftop at dawn with moving fog and reflective neon.</textarea>
        </label>
        <label>Duration (seconds)
          <input name="duration" type="number" min="1" max="10" value="5" required>
        </label>
        <label>Image URL
          <input name="image_url" type="url" placeholder="https://example.com/reference.png" required>
        </label>
        <button type="submit">Generate</button>
      </form>
      <p id="generate-result" class="result">No generation yet.</p>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
