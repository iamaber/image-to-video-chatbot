[project]
name = "chatbot"
version = "0.1.0"
description = "Image-to-video generation chatbot using Runway/Minimax"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.123.10",
    "pydantic-ai>=0.7.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "uvicorn[standard]>=0.27.0",
    "openai>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",
    "bcrypt>=4.3.0,<5.0.0",
    "pyjwt>=2.8.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
]
