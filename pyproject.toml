[project]
name = "vid-chatbot"
version = "0.1.0"
description = "Image-to-video generation app using Stable Video Diffusion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.11.0",
    "diffusers>=0.35.1",
    "fastapi[standard]>=0.123.10",
    "imageio[ffmpeg]>=2.37.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    "pillow>=10.0.0",
    "pydantic>=2.0.0",
    "torch>=2.8.0",
    "transformers>=4.56.0",
    "uvicorn[standard]>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
